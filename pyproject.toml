[project]
name = "antroute"
version = "0.1.0"
description = "AntRoute PoC: Ant Colony System for a crowd-aware Time-Dependent Orienteering Problem (Manhattan)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "numba>=0.60",
    "ortools>=9.10",
    "folium>=0.17",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["antroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: tests that need data/raw/dataset_TSMC2014_NYC.txt"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
